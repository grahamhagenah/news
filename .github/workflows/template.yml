name: Update the newsfeed template

# Keeps grahamhagenah/newsfeed — the newsfeed on its own, which "Use this template" copies — in step with the
# newsfeed here. It needs a TEMPLATE_TOKEN secret: a fine-grained token with Contents: read and write on that
# repo and nothing else. Without one, this says so and stops, so the rest of the repo is unaffected.
on:
  push:
    branches: [main]
    paths:
      - news/**
      - shared/**
      - tests/test_news.py
      - tests/test_shared.py
      - tests/fixtures/news/**
      - .github/workflows/template.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsfeed-template

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Writes the copy, and checks its tests and a build pass inside it before any of it is published.
      - run: python3 -m news.template template
      - env:
          TOKEN: ${{ secrets.TEMPLATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No TEMPLATE_TOKEN secret, so grahamhagenah/newsfeed wasn't updated."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/grahamhagenah/newsfeed.git" copy
          # Everything it holds comes from here, so what's no longer written is no longer in it.
          find copy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R template/. copy/
          cd copy
          git add -A
          if git diff --quiet --cached; then
            echo "The template is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "The newsfeed as of grahamhagenah/news@${GITHUB_SHA:0:7}"
          git push
