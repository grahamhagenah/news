name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub runs schedules on a best-effort basis and often drops runs at :00 and :30, when everyone's
    # cron fires. Odd minutes are quieter, and every 15 minutes means a dropped run costs little.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write  # alerts.py opens and closes "Source failing" issues.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The feed reader against saved samples of real feeds; a change that breaks it isn't deployed.
      - run: python3 -m unittest discover -s tests
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # An issue for any feed failing for hours (GitHub emails about it); never holds up the page.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 alerts.py dist/feeds.json
        env:
          GH_TOKEN: ${{ github.token }}

  # GitHub turns off scheduled workflows after 60 days without a commit, which would freeze the page;
  # it disables the whole workflow, so cron-job.org's workflow_dispatch calls would stop working too.
  # If the repo has been quiet for 50 days, an empty commit resets that clock.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
