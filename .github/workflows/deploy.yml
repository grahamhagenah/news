name: Build and deploy

# Builds both pages. The newsfeed is published from this repo, to news.grahamhagenah.com. The events page is
# pushed to the grahamhagenah/events repo, which publishes it to events.grahamhagenah.com: a repo can publish
# only one GitHub Pages site.
on:
  push:
    branches: [main]
  schedule:
    # GitHub runs schedules on a best-effort basis and often drops runs at :00 and :30, when everyone's
    # cron fires. Odd minutes are quieter, and every 15 minutes means a dropped run costs little.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      events:
        description: Rebuild the events page now, not only when it's due
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write  # shared/alerts.py opens and closes "Source failing" issues.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Both pages' readers against saved samples of their sources; a change that breaks one isn't deployed.
      - run: python3 -m unittest
      - run: python3 -m news.build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/news
      - id: deployment
        uses: actions/deploy-pages@v4

      # The events page, after the newsfeed is out, so a problem with it never holds the newsfeed up. Its
      # listings change slowly, so it rebuilds every three hours, or at once after a push or when "Run
      # workflow" is started with its events box ticked.
      - run: python3 -m events.build
        env:
          # A free Ticketmaster Discovery API key, for venues like the Paradise.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          # Empty means build now. (In GitHub's `a && b || c`, b can't be empty, so the condition is inverted.)
          EVENTS_EVERY_HOURS: ${{ (github.event_name != 'push' && !inputs.events) && '3' || '' }}
      - name: Publish the events page
        if: hashFiles('dist/events/index.html') != ''
        env:
          # A deploy key that can write to the events repo, and nothing else.
          DEPLOY_KEY: ${{ secrets.EVENTS_DEPLOY_KEY }}
        run: |
          # The events repo serves its gh-pages branch. Each publish replaces the branch with one new commit,
          # so that repo doesn't grow with every build.
          echo events.grahamhagenah.com > dist/events/CNAME
          touch dist/events/.nojekyll
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/events && chmod 600 ~/.ssh/events
          cd dist/events
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Events page, built from grahamhagenah/news@${GITHUB_SHA::7}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/events -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -qf git@github.com:grahamhagenah/events.git gh-pages

      # The same listings for anyone, as Boston, Weekly, pushed to the grahamhagenah/boston-weekly repo's
      # gh-pages branch, which publishes it (for now at grahamhagenah.github.io/boston-weekly).
      - name: Publish the public events page
        if: hashFiles('dist/public/index.html') != ''
        env:
          # A deploy key that can write to the boston-weekly repo, and nothing else.
          DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
        run: |
          touch dist/public/.nojekyll
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/public && chmod 600 ~/.ssh/public
          cd dist/public
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Boston, Weekly, built from grahamhagenah/news@${GITHUB_SHA::7}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/public -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -qf git@github.com:grahamhagenah/boston-weekly.git gh-pages

      # An issue for any source failing for hours (GitHub emails about it); never holds up either page. A page
      # not built this run is left out, so its issues stay as they are.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -m shared.alerts news=dist/news/feeds.json events=dist/events/listings.json
        env:
          GH_TOKEN: ${{ github.token }}

  # GitHub turns off scheduled workflows after 60 days without a commit, which would freeze both pages;
  # it disables the whole workflow, so cron-job.org's workflow_dispatch calls would stop working too.
  # If the repo has been quiet for 50 days, an empty commit resets that clock.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
