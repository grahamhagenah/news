name: Note a housing project

# A project's panel opens a pre-filled issue titled "Note <project id>" ("Suggest a correction"). Anyone may
# open one; only the repo owner's is applied, since anyone can open an issue on a public repo. Someone else's
# waits, labelled, for the owner to judge and to note themselves. This edits housing/edits.txt, replies on the
# issue, closes it, and redeploys.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: housing-notes

jobs:
  note:
    if: startsWith(github.event.issue.title, 'Note ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      # Anyone else's is left for the owner to read; the site says nothing until they do.
      - if: github.event.issue.user.login != github.repository_owner
        run: |
          gh issue edit "$NUMBER" --add-label "correction" || true
          gh issue comment "$NUMBER" --body "Thanks — this is a suggestion, not a change: someone will check it
          against the city's own record before the site says anything."
      - if: github.event.issue.user.login == github.repository_owner
        id: edit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 -m housing.notes
      - if: steps.edit.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.edit.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$SUMMARY (#$NUMBER)"
          git push
          # Pushes made from a workflow don't start other workflows, so start the deploy directly.
          gh workflow run deploy.yml
      - if: steps.edit.outputs.changed == 'true'
        run: |
          gh issue comment "$NUMBER" --body-file reply.md
          gh issue close "$NUMBER" --reason completed
      - if: steps.edit.outputs.changed == 'false'
        run: |
          gh issue comment "$NUMBER" --body-file reply.md
          gh issue close "$NUMBER" --reason "not planned"
      - if: failure()
        run: >-
          gh issue comment "$NUMBER" --body "Something went wrong while updating housing/edits.txt.
          The log is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
