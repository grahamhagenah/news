table, td, tr, th {

table { border: none; }
:root {
    --cal-border-spacing: 3px;
    --cal-num-events-shown: 8;

table.spexcal {

}
.spexcal th {

}
.spexcal td {

    font-size: 14px;
    width: calc((100vw - var(--cal-padding)) / var(--num-events-shown));
}
.spexcal td[rowspan="2"] {
    height: 260px;
}
.spexcal td[rowspan="3"] {
    height: 390px;
}
.spexcal td > a {
    display: block;
}
.spexcal td img {
    width: calc((100vw - var(--cal-padding)) / var(--num-events-shown));
    height: auto;
    max-width: 100px;
    max-height: 130px;
}
.todays-events-header {

.todays-events-header::after {

@media all and (max-width: 640px) {

    }

@media all and (max-width: 450px) {
    body {
        font-size: 12px;
        line-height: 12px;
    }
}
@media all and (max-width: 390px) {
    body {
        font-size: 9px;
        line-height: 9px;
    }
}
